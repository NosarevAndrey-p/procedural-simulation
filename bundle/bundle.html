<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik+Mono+One&display=swap");

      * {
        /* outline: 1px dashed red; */
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          Poppins,
          Segoe UI,
          Tahoma,
          sans-serif;

        transition: background-color 0.3s ease-in-out;
      }

      html {
        line-height: 1.25;
        font-family:
          Poppins,
          Segoe UI,
          Tahoma,
          sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;

        background-color: var(--main-bg);
        color: var(--main-text);
      }

      main {
        position: relative;
        flex-grow: 1;

        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .fish-pool-container {
        flex-grow: 1;
        width: 100%;
        height: 100%;
        /* width: 400px; */
        height: 400px;
        overflow: hidden;
        position: relative;
      }
      .fish-canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        object-fit: cover;
      }

      .ui {
        position: absolute;
        top: 0;
        padding: 20px;

        background: rgba(255, 255, 255, 0.16);
        border-radius: 0 0 16px 16px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(4.5px);
        -webkit-backdrop-filter: blur(4.5px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      summary {
        text-align: center;
      }
      .settings {
        margin-top: 20px;

        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }

      .radio-container {
        display: flex;
        flex-direction: column;
      }

      .option-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
      }

      .option-container > div {
        display: flex;
        flex-direction: row;
        gap: 4px;
        align-items: center;
      }

      button {
        padding: 4px 8px;
      }
      #amount-label {
        text-align: end;
        width: 30px;
      }

      .hidden {
        display: none;
      }
    </style>
    <title>Fish procedural animation</title>
  </head>
  <body>
    <main>
      <div class="fish-pool-container">
        <canvas
          id="canvas"
          class="fish-canvas"
          width="1200"
          height="1200"
        ></canvas>
      </div>
      <details id="settings" class="ui">
        <summary>Settings</summary>
        <div class="settings">
          <div class="radio-container">
            <div>
              <input
                type="radio"
                id="fish"
                name="animal"
                value="fish"
                checked
              />
              <label for="fish">Fish</label>
            </div>
            <div>
              <input type="radio" id="lizard" name="animal" value="lizard" />
              <label for="lizard">Lizard</label>
            </div>
          </div>
          <div class="option-container">
            <p>BODY COLOR</p>
            <div>
              <input id="body-color" type="color" value="#ffffff" />
              <button id="body-color-random" disabled="true">RANDOM</button>
            </div>
          </div>
          <div id="fin-option" class="option-container">
            <p>FIN COLOR</p>
            <div>
              <input id="fin-color" type="color" value="#ffffff" />
              <button id="fin-color-inherit" disabled="true">INHERIT</button>
            </div>
          </div>
          <div class="option-container">
            <label for="outline-color">OUTLINE COLOR</label>
            <input type="color" id="outline-color" value="#04080a" />
          </div>
          <div class="option-container">
            <label for="eye-color">EYE COLOR</label>
            <input type="color" id="eye-color" value="#04080a" />
          </div>
          <div class="option-container">
            <p>AMOUNT OF ANIMALS</p>
            <div>
              <label for="amount" id="amount-label">10</label>
              <input
                value="150"
                type="range"
                name="amount"
                id="amount"
                min="0"
                max="400"
                step="10"
              />
            </div>
          </div>
          <button id="confirm">CONFIRM</button>
        </div>
      </details>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.x/dist/pixi.min.js"></script>

            if (typeof max === "undefined") {

              min = -min;

        function getMousePos(canvas2, evt) {
          var rect = canvas2.getBoundingClientRect();
          const ratioComp =
            rect.width / rect.height < canvas2.width / canvas2.height;
          const scalingFactor = ratioComp
            ? canvas2.height / rect.height
            : canvas2.width / rect.width;
          const offestX = ratioComp
            ? ((canvas2.width / canvas2.height) * rect.height - rect.width) / 2
            : 0;
          const canvasX = (offestX + evt.clientX - rect.left) * scalingFactor;
          const offestY = !ratioComp
            ? ((canvas2.height / canvas2.width) * rect.width - rect.height) / 2
            : 0;
          const canvasY = (offestY + evt.clientY - rect.top) * scalingFactor;
          return new Vector2D(canvasX, canvasY);
        }
        function hsvToRgb(h, s, v) {
          var r, g, b;
          var i = Math.floor(h * 6);
          var f = h * 6 - i;
          var p = v * (1 - s);
          var q = v * (1 - f * s);
          var t = v * (1 - (1 - f) * s);
          switch (i % 6) {
            case 0:
              ((r = v), (g = t), (b = p));
              break;
            case 1:
              ((r = q), (g = v), (b = p));
              break;
            case 2:
              ((r = p), (g = v), (b = t));
              break;
            case 3:
              ((r = p), (g = q), (b = v));
              break;
            case 4:
              ((r = t), (g = p), (b = v));
              break;
            case 5:
              ((r = v), (g = p), (b = q));
              break;
          }
          return [r * 255, g * 255, b * 255];
        }

          const rHex = r.toString(16).padStart(2, "0");
          const gHex = g.toString(16).padStart(2, "0");
          const bHex = b.toString(16).padStart(2, "0");
          return `#${rHex}${gHex}${bHex}`;
        }

          const d = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));

            this.mousePos = Vector2D.Zero;
            this.ripples = new RipplesManager(maxRipples);
            this.riplesContainer = new PIXI.Container();
            this.riplesObjects = [];
          }
          /**
           * Updates the simulation state, including boid behaviors and interactions with ripple points.
           *
           * @param {number} deltaTime - The time elapsed since the last update in milliseconds.
           */
          update(deltaTime) {
            const ripplePoints = this.ripples.getPoints();
            this.flock.forEach((boid) => {
              boid.edges(this.boundaries);
              boid.flock(this.flock, this.params);
              ripplePoints.forEach((point) => {
                boid.applyForce(
                  point,
                  this.params.mouseForceScale,
                  this.params.mouseForceRadius,
                );
              });
              boid.update(deltaTime, this.params);
            });
          }
          /**
           * Initializes the Pixi.js graphics for the simulation, including boid visuals and ripple effects.
           */
          initPixiGrafics() {
            this.flock.forEach((boid) => {
              boid.animal.initPixiGrafics();
            });
            const divisor = this.ripples.divisor;
            const threshold = this.ripples.threshold;
            const startVars = this.ripples.startVars;
            const delay = this.ripples.delay;
            const maxRipples = this.ripples.maxRipples;
            const maxRadius = threshold + delay / divisor;
            for (let i = 0; i < maxRipples; i++) {
              const circleContainer = new PIXI.Container();
              this.riplesContainer.addChild(circleContainer);
              const rplObj = {
                container: circleContainer,
                circles: [],
              };
              for (let j = 0; j < startVars.length; j++) {
                const c = new PIXI.Graphics();
                c.circle(0, 0, maxRadius);
                c.stroke({ width: 8, color: "white" });
                circleContainer.addChild(c);
                rplObj.circles.push(c);
              }
              this.riplesObjects.push(rplObj);
            }
          }
          /**
           * Updates the Pixi.js graphics for the ripple effects based on the current simulation state.
           */
          updatePixiRiples() {
            const divisor = this.ripples.divisor;
            const threshold = this.ripples.threshold;
            const startVars = this.ripples.startVars;
            const delay = this.ripples.delay;
            const maxRadius = threshold + delay / divisor;
            const simSize = this.ripples.points.length;
            const positions = this.ripples.getPointsWithTimes();
            for (let i = 0; i < this.riplesObjects.length; i++) {
              const rplObj = this.riplesObjects[i];
              if (i >= simSize) {
                rplObj.container.visible = false;
              } else {
                const ripple = positions[i];
                rplObj.container.visible = true;
                rplObj.container.position.set(ripple.pos.x, ripple.pos.y);
                for (let j = 0; j < rplObj.circles.length; j++) {
                  const ripleCrcl = rplObj.circles[j];
                  const rplPoint = positions[i];
                  const timeToDeletion = rplPoint.time / delay;
                  const radius = threshold + rplPoint.time / divisor;
                  const curRadius = radius - startVars[j];
                  if (curRadius < 0) {
                    ripleCrcl.alpha = 0;
                    continue;
                  }
                  ripleCrcl.scale = curRadius / maxRadius;
                  const alpha =
                    Math.pow(1 - curRadius / maxRadius, 2) *
                    Math.pow(1 - timeToDeletion, 0.2);
                  ripleCrcl.alpha = alpha;
                }
              }
            }
          }
          /**
           * Updates the Pixi.js graphics for the boid visuals based on the current simulation state.
           */
          updatePixiGrafics() {
            this.flock.forEach((boid, index) => {
              boid.animal.updatePixiGrafics();
            });
          }
          /**
           * Attaches the Pixi.js graphics containers for boids and ripples to the given stage.
           *
           * @param {PIXI.Container} stage - The Pixi.js stage to which the graphics containers will be attached.
           */
          attachPixiContainers(stage) {
            this.graphicContainers.forEach((c) => {
              this.graphicContainer.addChild(c);
            });
            stage.addChild(this.graphicContainer);
            stage.addChild(this.riplesContainer);
          }
          /**
           * Displays the boids using their animal visuals.
           *
           * @param {CanvasRenderingContext2D} ctx - The 2D rendering context of the canvas.
           */
          displayAnimal(ctx) {
            this.flock.forEach((boid) => {
              boid.displayAnimal(ctx);
            });
          }
          /**
           * Displays the boids with simple shapes and the ripple circles.
           *
           * @param {CanvasRenderingContext2D} ctx - The 2D rendering context of the canvas.
           */
          displaySimple(ctx) {
            this.flock.forEach((boid) => {
              boid.displaySimple(ctx);
            });
            ctx.strokeStyle = "yellow";
            ctx.lineWidth = 2;
            this.ripples.getPointsWithTimes().forEach((point) => {
              ctx.beginPath();
              ctx.arc(
                point.point.x,
                point.point.y,
                this.params.mouseForceRadius,
                0,
                Math.PI * 2,
              );
              ctx.stroke();
              ctx.closePath();
            });
          }
          /**
           * Displays the ripple effects based on the points' elapsed time and delay.
           *
           * @param {CanvasRenderingContext2D} ctx - The 2D rendering context of the canvas.
           */
          displayRipples(ctx) {
            ctx.lineWidth = 3;
            const divisor = this.ripples.divisor;
            const threshold = this.ripples.threshold;
            const startVars = this.ripples.startVars;
            const delay = this.ripples.delay;
            const maxRadius = threshold + delay / divisor;
            this.ripples.getPointsWithTimes().forEach((point) => {
              if (point.time < delay) {
                const timeToDeletion = point.time / delay;
                const radius = threshold + point.time / divisor;
                for (let i = 0; i < startVars.length; i++) {
                  const curRadius = radius - startVars[i];
                  if (curRadius < 0) continue;
                  const color =
                    Math.pow(1 - curRadius / maxRadius, 2) *
                    Math.pow(1 - timeToDeletion, 0.2);
                  ctx.strokeStyle = `rgba(255, 255, 255, ${color})`;
                  ctx.beginPath();
                  ctx.arc(point.pos.x, point.pos.y, curRadius, 0, Math.PI * 2);
                  ctx.stroke();
                  ctx.closePath();
                }
              }
            });
          }
          /**
           * Adds a new ripple point at the current mouse position.
           */
          addPoint() {
            this.ripples.addPoint(Vector2D.fromVec2D(this.mousePos));
          }
          /**
           * Sets the current mouse position.
           *
           * @param {Vector2D} vec - The new mouse position.
           */
          setMousePos(vec) {
            this.mousePos.set(vec.x, vec.y);
          }
          /**
           * Sets the new bounds.
           *
           * @param {number} newWidth - The new width.
           * @param {number} newHeight - The new height.
           * @param {number} [newMargin=undefined] - The new margin. If left to be `undefined`, sets current margin.
           */
          setBounds(newWidth, newHeight, newMargin = void 0) {
            newWidth = Math.max(1, newMargin);
            newHeight = Math.max(1, newHeight);
            const margin =
              typeof newMargin !== "undefined"
                ? newMargin
                : this.boundaries.margin;
            this.boundaries = {
              width: newWidth + margin * 2,
              height: newHeight + margin * 2,
              left: -margin,
              top: -margin,
              margin,
            };
          }
          /**
           * Sets style for the creatures
           * @param {{ fill: string, outline: string, outlineWidth: number, eyesColor: string }} [style={ fill: "#01111c", finFill: "#01111c", outline: "#04080a", outlineWidth: 1.5, eyesColor: "#04080a" }] - The style settings for the animals. To make all animals have different color, set `fill: "random"`.
           */
          setStyle(style2) {
            this.flock.forEach((boid) => {
              boid.animal.setStyle(JSON.parse(JSON.stringify(style2)));
            });
          }
          addAnimal(i = 0) {
            const scale =
              this.sizesRange[0] +
              Math.random() * (this.sizesRange[1] - this.sizesRange[0]);
            const uniqueStyle = JSON.parse(JSON.stringify(this.style));
            let animal;
            switch (this.animalType) {
              case AnimalType.UNDEFINED:
                animal = this.customAnimalCallback(
                  i,
                  uniqueStyle,
                  scale,
                  this.isLowRes,
                );
                break;
              case AnimalType.LIZARD:
                animal = new Lizard(
                  Vector2D.Zero,
                  uniqueStyle,
                  scale,
                  this.isLowRes,
                );
                break;
              case AnimalType.SNAKE:
                animal = new Snake(Vector2D.Zero, uniqueStyle, scale);
                break;
              case AnimalType.FISH:
              default:
                animal = new Fish(
                  Vector2D.Zero,
                  uniqueStyle,
                  scale,
                  this.isLowRes,
                );
                break;
            }
            this.graphicContainers.push(animal.graphicContainer);
            this.flock.push(
              new Boid(
                this.boundaries.width,
                this.boundaries.height,
                this.boundaries.left,
                this.boundaries.top,
                animal,
                this.spawnPlace,
              ),
            );
            return animal;
          }
          updateBoidAmount(amount2) {
            const curAmount = this.flock.length;
            if (amount2 < curAmount) {
              const amountToDelete = curAmount - amount2;
              const itemsToDelete = this.flock.slice(-amountToDelete);
              itemsToDelete.forEach((boid) => boid.destroy());
              this.flock = this.flock.slice(0, -amountToDelete);
              this.graphicContainers = this.graphicContainers.slice(
                0,
                -amountToDelete,
              );
            } else {
              const amountToAdd = amount2 - curAmount;
              for (let i = 0; i < amountToAdd; i++) {
                const animal = this.addAnimal(amount2 + i);
                animal.initPixiGrafics();
                this.graphicContainer.addChild(animal.graphicContainer);
              }
            }
          }
          replaceAnimalType(newAnimalType) {
            const animalAmount = this.flock.length;
            this.updateBoidAmount(0);
            this.animalType = newAnimalType;
            this.updateBoidAmount(animalAmount);
          }
        };
        var RendererType = Object.freeze({
          CANVAS: "canvas",
          PIXI: "pixi",
        });
        var SimulationWrapper = class {
          /**
           * Creates an instance of SimulationWrapper.
           *
           * @param {HTMLCanvasElement} canvas - The canvas element on which the simulation will be rendered.
           * @param {Simulation} [simulation=undefined] - The simulation instance to be managed.
           * @param {RendererType} [renderer=RendererType.PIXI] - The type of renderer to use (PIXI or CANVAS). PIXI is preffered.
           * @param {string} [background="#082a68"] - The background color of the canvas.
           * @param {number} [precalculateBy=100] - The number of initial simulation steps to precalculate.
           */
          constructor(
            canvas2,
            background = "#061f30",
            simulation = void 0,
            renderer = RendererType.PIXI,
            precalculateBy = 0,
          ) {
            this.renderer = renderer;
            this.isTickerActive = true;
            if (!simulation) {
              this.simulation = this.defaultSimulation(canvas2);
            } else {
              this.simulation = simulation;
            }
            this.canvas = canvas2;
            this.background = background;
            this.canvas.style.background = this.background;
            this.mousePos = new Vector2D(0, 0);
            this.isInteractable = false;
            this._mousemoveListener = (event) => {
              const pos = getMousePos(this.canvas, event);
              this.mousePos.set(pos.x, pos.y);
              this.simulation.setMousePos(pos);
            };
            this._mousedownListener = (event) => {
              this.simulation.addPoint();
            };
            this.lastTime = performance.now();
            for (let i = 0; i < Math.min(precalculateBy, 1e3); i++) {
              this.simulation.update(1);
            }
            switch (this.renderer) {
              case RendererType.CANVAS:
                this.ctx = canvas2.getContext("2d");
                this.initCanvas();
                break;
              case RendererType.PIXI:
              default:
                this.app = new PIXI.Application();
                this.initPixi();
                break;
            }
          }
          /**
           * Creates simulation object with default parameters.
           * @param {HTMLCanvasElement} canvas - The canvas element on which the simulation will be rendered.
           */
          defaultSimulation(canvas2) {
            const bounds = {
              width: canvas2.width,
              height: canvas2.height,
              margin: 200,
            };
            const params = new SimulationParams();
            params.setImpactForces(1, 0.8, 1.2);
            params.maxVelocity = this.renderer == RendererType.PIXI ? 3 : 8;
            params.maxAcceleration = RendererType.PIXI ? 0.3 : 1;
            const style2 = {
              fill: "#01111c",
              //"#0b2b42",
              // fill: "random",
              finFill: "#01111c",
              //"#0b2b42",
              outline: "#04080a",
              //"#0a2030",
              outlineWidth: 1.5,
              eyesColor: "#04080a",
              //"#0a2030",
            };
            const simulation = new Simulation(
              150,
              bounds,
              params,
              style2,
              [0.5, 1],
              AnimalType.FISH,
              true,
              PositionType.SIDES,
              20,
            );
            return simulation;
          }
          /**
           * Add or remove event listeners for mouse movements and clicks on the canvas.
           * @param {boolean} [isToggled=true] To add or to remove listeners.
           */
          toggleInteractions(isToggled = true) {
            if (isToggled === this.isInteractable) return;
            this.isInteractable = isToggled;
            if (this.isInteractable) {
              this.canvas.addEventListener(
                "mousemove",
                this._mousemoveListener,
              );
              this.canvas.addEventListener(
                "mousedown",
                this._mousedownListener,
              );
            } else {
              console.log("called");
              this.canvas.removeEventListener(
                "mousemove",
                this._mousemoveListener,
              );
              this.canvas.removeEventListener(
                "mousedown",
                this._mousedownListener,
              );
            }
          }
          /**
           * Initializes the PIXI renderer and attaches the PIXI containers.
           */
          async initPixi() {
            await this.app.init({
              canvas: this.canvas,
              width: this.canvas.width,
              height: this.canvas.height,
              preference: "webgl",
              background: this.background,
              antialias: true,
            });
            this.simulation.initPixiGrafics();
            this.simulation.attachPixiContainers(this.app.stage);
            this.app.renderer.events.autoPreventDefault = false;
            this.app.renderer.view.canvas.style["touch-action"] = "auto";
            this.app.ticker.add((delta) => {
              if (this.isTickerActive) {
                this.simulation.update(delta.deltaTime);
                this.simulation.updatePixiGrafics();
                this.simulation.updatePixiRiples();
              }
            });
          }
          /**
           * Animation loop for the canvas renderer.
           *
           * @param {DOMHighResTimeStamp} timestamp - The current time for the animation frame.
           */
          animate = (timestamp) => {
            const deltaTime = (timestamp - this.lastTime) / 30;
            this.lastTime = timestamp;
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            this.simulation.update(deltaTime);
            this.simulation.displayAnimal(this.ctx);
            this.simulation.displayRipples(this.ctx);
            requestAnimationFrame(this.animate);
          };
          /**
           * Initializes the canvas renderer and starts the animation loop.
           */
          initCanvas() {
            requestAnimationFrame(this.animate);
          }
          /**
           * Resizes resolution of the canvas to the specified size. Simulation bounds are also adjusted.
           * @param {number} width - Width to resize canvas to.
           * @param {number} height - Height to resize canvas to.
           */
          resize(width = 1600, height = 600) {
            width = Math.max(width, 1);
            height = Math.max(height, 1);
            setTimeout(() => {
              this.simulation.setBounds(width, height);
              switch (this.renderer) {
                case RendererType.CANVAS:
                  this.canvas.width = width;
                  this.canvas.height = height;
                  break;
                case RendererType.PIXI:
                default:
                  this.app.renderer.resize(width, height);
                  break;
              }
            });
          }
          /**
           * @param {{ fill: string, outline: string, outlineWidth: number, eyesColor: string }} [style={ fill: "#01111c", finFill: "#01111c", outline: "#04080a", outlineWidth: 1.5, eyesColor: "#04080a" }] - The style settings for the animals. To make all animals have different color, set `fill: "random"`.
           * @param {string} [background="#061f30"] - Canvas background new color.
           */
          setBasicStyle(
            style2 = {
              fill: "#01111c",
              finFill: "#01111c",
              outline: "#04080a",
              outlineWidth: 1.5,
              eyesColor: "#04080a",
            },
            background = "#061f30",
          ) {
            this.background = background;
            this.canvas.style.background = this.background;
            if (this.renderer === RendererType.PIXI) {
              this.app.renderer.background._backgroundColor.value =
                this.background;
            }
            this.simulation.setStyle(style2);
          }
          changeCreaturesAmount(amount2) {
            if (amount2 < 0) return;
            this.isTickerActive = false;
            this.simulation.updateBoidAmount(amount2);
            this.isTickerActive = true;
          }
          replaceAnimalType(newAnimalType) {
            this.simulation.replaceAnimalType(newAnimalType);
          }
        };

        // public/scipts/index.js
        var canvas = document.getElementById("canvas");
        var simWrapper = new SimulationWrapper(canvas);
        simWrapper.toggleInteractions(true);
        var previousData = {
          animalType: AnimalType.FISH,
          amount: 150,
          style: {
            fill: "random",
            finFill: "inherit",
            outline: "#04080a",
            outlineWidth: 1.5,
            eyesColor: "#04080a",
          },
        };
        var style = {
          ...previousData.style,
        };
        var bodyColorInput = document.getElementById("body-color");
        var randomButton = document.getElementById("body-color-random");
        bodyColorInput.addEventListener("input", function () {
          style.fill = bodyColorInput.value;
          randomButton.disabled = false;
        });
        randomButton.addEventListener("click", function () {
          style.fill = "random";
          randomButton.disabled = true;
        });
        var finColorInput = document.getElementById("fin-color");
        var inheritButton = document.getElementById("fin-color-inherit");
        finColorInput.addEventListener("input", function () {
          style.finFill = finColorInput.value;
          inheritButton.disabled = false;
        });
        inheritButton.addEventListener("click", function () {
          style.finFill = "inherit";
          inheritButton.disabled = true;
        });
        var selectedAnimal = AnimalType.FISH;
        var animalRadios = document.querySelectorAll('input[name="animal"]');
        animalRadios.forEach((radio) => {
          radio.addEventListener("change", handleAnimalChange);
        });
        var finDiv = document.getElementById("fin-option");
        var animalMap = {
          fish: AnimalType.FISH,
          lizard: AnimalType.LIZARD,
        };
        function handleAnimalChange(event) {
          selectedAnimal = animalMap[event.target.value];
          if (selectedAnimal === AnimalType.FISH) {
            finDiv.classList.remove("hidden");
          } else {
            finDiv.classList.add("hidden");
          }
        }
        var outlineColorInput = document.getElementById("outline-color");
        outlineColorInput.addEventListener("input", function () {
          style.outline = outlineColorInput.value;
        });
        var eyeColorInput = document.getElementById("eye-color");
        eyeColorInput.addEventListener("input", function () {
          style.eyesColor = eyeColorInput.value;
        });
        var amount = 150;
        var rangeInput = document.getElementById("amount");
        var rangeLabel = document.getElementById("amount-label");
        rangeLabel.textContent = rangeInput.value;
        rangeInput.addEventListener("input", function () {
          rangeLabel.textContent = rangeInput.value;
          amount = parseInt(rangeInput.value);
        });
        function updateSimulationSettings() {
          let styleCopy = { ...style };
          if (styleCopy.finFill === "inherit") {
            delete styleCopy.finFill;
          }
          if (selectedAnimal !== previousData.animalType) {
            simWrapper.replaceAnimalType(selectedAnimal);
            simWrapper.setBasicStyle(styleCopy, "#29c6ff");
          } else if (amount != previousData.amount) {
            simWrapper.changeCreaturesAmount(amount);
            simWrapper.setBasicStyle(styleCopy, "#29c6ff");
          } else {
            simWrapper.setBasicStyle(styleCopy, "#29c6ff");
          }
          previousData.amount = amount;
          previousData.animalType = selectedAnimal;
          previousData.style = { ...style };
        }
        document
          .getElementById("confirm")
          .addEventListener("click", function () {
            document.getElementById("settings").open = false;
            updateSimulationSettings();
          });
        setTimeout(() => {
          updateSimulationSettings();
          console.log(style);
        });
      })();
    </script>
  </body>
